plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ancientpersia.rps'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.amir.sangkaghazgheichy'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.5'

        // ---------- پرداخت درون‌برنامه‌ای کافه بازار (روش رسمی مستندات جاوا) ----------
        // کلید عمومی بازی از پنل توسعه‌دهندگان کافه بازار
        buildConfigField "String", "IAB_PUBLIC_KEY",
                '"MIHNMA0GCSqGSIb3DQEBAQUAA4G7ADCBtwKBrwDGxSh8Ei3QOCGx8XzhtTtRLJArdJxMAx/AAARfvN4d6kkcWRLtYYrwc1yRHpQHrPyhASIiwqR81rf7WhxyWbCBkPNRQoj0QoZpeoRGey1H+IsdXlOYwuv6RY7pa1mXnL/bqyU5PxPvT5An8uqCi/9TQWNWhnsYowwyjnzVTE7KEqhLtP9c4RoGLMFhHVv1EA2CX6NxsB4MdREqhjLGDehpznWKss/ACpZ+BAz42GcCAwEAAQ=="'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        // لازم برای IInAppBillingService.aidl (از AGP 8 به بعد پیش‌فرض خاموشه)
        aidl true
        viewBinding true
        // تولید BuildConfig برای خواندن IAB_PUBLIC_KEY طبق مستندات کافه بازار
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // SDK تبلیغات ادیوری
    implementation 'com.adivery:sdk:4.9.0'
}
